name: deploy-student-app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-student-app
  cancel-in-progress: false

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read

env:
  NS: student-gitaction
  RESOURCE_GROUP: rg-karthik-aks-student
  CLUSTER_NAME: aks-student-app
  ACR_NAME: aksstudent

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/student-backend-gitaction:1.0
            ${{ secrets.ACR_LOGIN_SERVER }}/student-backend-gitaction:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/student-frontend-gitaction:1.0
            ${{ secrets.ACR_LOGIN_SERVER }}/student-frontend-gitaction:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Set image registry and tag in manifests
        run: |
          sed -i "s|__REGISTRY__|${{ secrets.ACR_LOGIN_SERVER }}|g; s|__TAG__|${{ github.sha }}|g" k8s/*.yaml

      - name: Apply manifests in order
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -n "$NS" -f k8s/tls.yaml
          kubectl apply -n "$NS" -f k8s/mongo.yaml
          kubectl apply -n "$NS" -f k8s/mongo-b.yaml
          kubectl apply -n "$NS" -f k8s/backend.yaml
          kubectl apply -n "$NS" -f k8s/frontend.yaml
          kubectl apply -n "$NS" -f k8s/frontend-svc.yaml
          kubectl apply -n "$NS" -f k8s/backend-secret.yaml

      - name: Wait for rollouts
        run: |
          for d in mongo-a mongo-b mongo-arb backend frontend; do
            kubectl rollout status deployment/$d -n "$NS" --timeout=240s
          done

      - name: Show status
        if: always()
        run: kubectl get pods,pvc,svc -n "$NS" -o wide

      - name: Diagnose failure
        if: failure()
        run: |
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -25
          for p in $(kubectl get pods -n "$NS" --no-headers | grep -v Running | awk '{print $1}'); do
            echo "=== $p ==="
            kubectl describe pod "$p" -n "$NS" | tail -15
          done