          volumeMounts:
            - name: secret
              mountPath: /secret
            - name: keyfile
              mountPath: /keyfile
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["--replSet", "rs0", "--keyFile", "/keyfile/keyfile", "--bind_ip_all"]
          ports:
